name: Field case
description: You ran a catalog team on real work for a week
title: "field-case: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        One real week beats another template. Use [docs/field-cases/README.md](https://github.com/cobusgreyling/grok-bot-templates/blob/main/docs/field-cases/README.md).
        Redact customers, keys, and internal hosts.
  - type: dropdown
    id: team
    attributes:
      label: Team
      options: [eng, loop, marketing, meta, ops, personal, product, research, sales, success, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Days 1 / 3 / 7. What the Bots produced. What they refused.
    validations:
      required: true
  - type: textarea
    id: still
    attributes:
      label: Still typed by hand
    validations:
      required: true
  - type: dropdown
    id: routine
    attributes:
      label: Would you enable a routine?
      options: ["not yet", "yes, after two good runs"]
    validations:
      required: true
