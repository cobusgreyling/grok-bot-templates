name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Rendered markdown is not dirty
        run: |
          npm run build
          git add templates skills routines docs/index.html docs/agent.html docs/catalog.json docs/api docs/badge.svg docs/llms.txt docs/profiles.json docs/header.jpg START.md catalog/catalog.json
          git diff --cached --exit-code -- templates skills routines docs/index.html docs/agent.html docs/catalog.json docs/api docs/badge.svg docs/llms.txt docs/profiles.json docs/header.jpg START.md catalog/catalog.json \
            || { echo "Run npm run build and commit generated files"; exit 1; }
