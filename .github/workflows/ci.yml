name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Rendered markdown is not dirty
        run: |
          npm run build
          git add templates skills routines docs/index.html START.md
          git diff --cached --exit-code -- templates skills routines docs/index.html START.md \
            || { echo "Run npm run build and commit generated files"; exit 1; }
          # catalog.json is rebuilt for the Pages site; timestamp-free and not a drift gate
