id: nightly-outbound-research
name: Nightly Outbound Research
owner: sales-outbound
cadence: weeknights 18:00 in the Bot timezone
skill: research-accounts
input_source: >
  CRM view, spreadsheet, or the pasted account list named in the Bot
  description, plus attached style examples
expected_result: >
  A review list with ICP score, intent evidence, up to three contacts,
  and DRAFT outreach. Nothing sent. Nobody enrolled.
approval_boundary: >
  Do not send email or LinkedIn messages. Do not enroll anyone in a
  sequence. Do not create CRM records unless the owner later names that.
missing_source: >
  If there is no account list, report the failure and stop. If ICP is
  undefined, do not invent one — leave the run failed until the owner
  answers. Do not reuse last night's scores as live intent.
test_first: true
prompt: >
  Run research-accounts on the named account list. Score against ICP and
  current intent with URLs, identify up to three contacts, draft email
  and LinkedIn outreach in the attached style, skip active sequences.
  Return a review list. Do not send or enroll anyone.
