id: weekly-competitor-diff
name: Weekly Competitor Diff
owner: competitor-watch
cadence: Mondays 09:00 in the Bot timezone
skill: diff-competitors
input_source: >
  Named competitor set (3–8) and the previous snapshot in /workspace
  when it exists
expected_result: >
  Baseline (first run) or material-change memo with before/after, URL,
  and date. Unchanged competitors listed in one line. Slack draft
  labeled DRAFT and unsent.
approval_boundary: >
  Do not post the memo to Slack or X. Do not scrape behind a login the
  owner did not authorize. Do not email competitors.
missing_source: >
  If the competitor list is missing, report the failure and stop. If a
  page is unavailable, write "page not found" rather than reusing last
  week's number silently. If no snapshot exists, take a baseline and
  stop after writing it.
test_first: true
prompt: >
  Run diff-competitors on the named set. Load last snapshot; baseline
  if none. Fetch current public pages. Quote numbers. Report only
  material changes with URLs and dates. Do not post the memo.
