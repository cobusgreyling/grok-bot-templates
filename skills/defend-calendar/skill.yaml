id: defend-calendar
name: Defend Calendar
when_to_use: >
  Deep-work blocks are being eaten by meetings, and the owner needs a
  protection pack: conflict map and unsent decline drafts, calendar
  left untouched.
inputs:
  - Google Calendar for the named window
  - Pinned deep-work hours or a priorities note
  - Slack (or mail) where the meeting request arrived, if connected
sequence:
  - Load the calendar window and the pinned deep-work hours. If hours are missing, ask once and stop.
  - List events that overlap a deep-work block or stack more than the owner's stated meeting cap.
  - For each conflict, draft a decline or reschedule note in the owner's voice. Label it DRAFT. Do not send.
  - Propose a hold the owner could accept. Do not create, move, or delete events.
  - Flag anything that looks like a customer, legal, or incident meeting so it is not auto-declined in a draft.
validate: >
  No event was created, moved, or deleted. Every draft names the event
  and the block it would protect. Customer/legal/incident items are
  called out, not declined by default.
returns: >
  Block map, conflict table, unsent decline drafts, and a "leave these
  alone" list. Action log of calendars scanned.
approval: >
  Do not change meetings, send declines, or invite anyone.
  Do not decline customer, legal, or incident events without asking.
owners:
  - calendar-defender
