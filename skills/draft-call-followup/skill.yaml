id: draft-call-followup
name: Draft Call Follow-up
when_to_use: >
  A call just happened and the owner needs an unsent recap, split tasks,
  and a suggested next window — not a sent email.
inputs:
  - Call notes, transcript, or recording
  - Calendar event for attendees and time
  - Prior mail thread with the account when present
  - Promise log in /workspace when present
sequence:
  - Read the notes. If they are missing, ask and stop.
  - List attendees from the calendar event. If the event is missing, mark attendees unknown.
  - Draft a recap of what was said. Separate facts from inferences.
  - Split owner tasks from customer tasks. Dates not in the notes stay unknown.
  - Propose a next window from free/busy. Do not book it.
  - Label the recap DRAFT. Do not send.
validate: >
  Recap is labeled DRAFT. No email was sent. No calendar event was created.
  Every dated commitment has a source quote, or the date is unknown.
returns: >
  After-call pack: recap, owner tasks, customer tasks, suggested window,
  CRM note draft, action log.
approval: >
  Do not send the recap. Do not book or move meetings. Do not create CRM
  records unless the owner names that action later.
owners:
  - call-followup
