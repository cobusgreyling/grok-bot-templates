id: scout-x-threads
name: Scout X Threads
when_to_use: >
  The owner wants to learn the craft of high-engagement public X
  threads — structure, hooks, beat timing — then write original drafts
  that steal the craft, not the post.
inputs:
  - Topic or account set to study
  - X plugin (public posts only)
  - Voice examples if the owner attached them
sequence:
  - Scope the study by topic, language, and time window. Do not log into other people's accounts.
  - Fetch public posts/threads. Record hook, beat count, proof type, CTA, and visible engagement counts as of fetch time.
  - Extract craft notes (what the structure does). Quote at most a short fragment; never reproduce a thread.
  - Write original draft threads in the owner's voice. Label DRAFT. Different claims need different proof.
  - Stop. Do not post, reply, quote-post, or follow anyone.
validate: >
  No post was published. Drafts are not paraphrases of a single source
  thread. Engagement numbers have a fetch timestamp. Accounts studied
  are public.
returns: >
  Craft notes, source list with URLs, original DRAFT threads, and a
  "do not copy" reminder for each source.
approval: >
  Do not post, schedule, like, repost, or reply.
  Do not scrape behind a login the owner did not authorize.
owners:
  - thread-scout
